name: grokcli-upstream

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  grok-egress:
    image: "${GROK2API_EGRESS_IMAGE:-metacubex/mihomo:v1.19.28}"
    restart: unless-stopped
    logging: *logging
    command: ["-d", "/root/.config/mihomo"]
    volumes:
      - "${GROK2API_EGRESS_CONFIG_DIR:-./mihomo}:/root/.config/mihomo:ro"
    cpus: "0.20"
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/version"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    mem_limit: 128m
    networks:
      default:
        aliases:
          - grokcli-upstream-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: grok2api
      POSTGRES_PASSWORD: "${GROK2API_POSTGRES_PASSWORD:?set GROK2API_POSTGRES_PASSWORD}"
      POSTGRES_DB: grok2api
    volumes:
      - grokcli_upstream_pg:/var/lib/postgresql/data
    mem_limit: 512m
    networks:
      default:
        aliases:
          - grokcli-upstream-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grok2api -d grok2api"]
      interval: 5s
      timeout: 5s
      retries: 12

  grokcli-2api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: "${GROK2API_APP_IMAGE:-grokcli-2api:20260726-api-only}"
    restart: unless-stopped
    logging: *logging
    env_file:
      - path: "${GROK2API_ENV_FILE:-.env}"
        required: true
    environment:
      GROK2API_API_ONLY: "1"
      GROK2API_HOST: 0.0.0.0
      GROK2API_PORT: "3000"
      GROK2API_OPEN_BROWSER: "0"
      GROK2API_STORE_BACKEND: hybrid
      GROK2API_REQUIRE_SHARED_STORES: "1"
      GROK2API_WORKERS: "${GROK2API_WORKERS:-2}"
      GROK2API_TOKEN_MAINTAIN: "1"
      GROK2API_MODEL_HEALTH: "1"
      GROK2API_REQUIRE_API_KEY: "1"
      GROK2API_UPSTREAM_PROXY: http://grok-egress:7890
      GROK2API_INLINE_SOLVER: "0"
      GROK2API_REG_AUTO_MAINTAIN: "0"
      REDIS_URL: redis://grokcli-upstream-redis:6379/0
      GROK2API_REDIS_URL: redis://grokcli-upstream-redis:6379/0
      DATABASE_URL: "postgresql://grok2api:${GROK2API_POSTGRES_PASSWORD}@grokcli-upstream-postgres:5432/grok2api"
      GROK2API_DATABASE_URL: "postgresql://grok2api:${GROK2API_POSTGRES_PASSWORD}@grokcli-upstream-postgres:5432/grok2api"
    ports:
      - "127.0.0.1:${GROK2API_BIND_PORT:-3301}:3000"
    mem_limit: 2g
    cpus: "2.00"
    pids_limit: 256
    volumes:
      - ./data:/app/data
    networks:
      default:
      new-api:
        aliases:
          - grokcli-2api
    depends_on:
      grok-egress:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  grokcli_upstream_pg:

networks:
  default:
    driver: bridge
  new-api:
    external: true
    name: "${GROK2API_NEW_API_NETWORK:-app_yunbay-network}"
